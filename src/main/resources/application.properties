micronaut:
application:
name: micronaut-crud

router:
static-resources:
swagger:
paths: classpath:META-INF/swagger
mapping: /swagger/**
swagger-ui:
paths: classpath:META-INF/swagger/views/swagger-ui
mapping: /swagger-ui/**

datasources:
default:
db-type: mysql
dialect: MYSQL
schema-generate: UPDATE
url: jdbc:mysql://localhost:3306/micronaut_crud?useSSL=false&allowPublicKeyRetrieval=true
username: root
password: ""
driver-class-name: com.mysql.cj.jdbc.Driver

---
micronaut:
configurations: test

datasources:
default:
url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
username: sa
password: ""
driver-class-name: org.h2.Driver
schema-generate: CREATE_DROP