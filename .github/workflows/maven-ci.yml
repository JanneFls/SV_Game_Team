name: Java CI with Maven
on: [push, pull_request]  # Se ejecuta en pushes y PRs

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Descarga el código
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'  # Versión de Java (ajusta según tu proyecto)
          distribution: 'temurin'
      - name: Build and test with Maven
        run: mvn test  # Ejecuta las pruebas
